<body>
    <h1 id="j"></h1>
    <h1 id="i"></h1>
    <form>
        <input type="password" name="a" id="password" placeholder="Enter the Password">
        <button onclick="fun1()">Submit</button>
    </form>

    <script>
        function fun1() {
            // let x = document.getElementById("a");
            // document.write(x.value);
            // document.write(document.getElementById("a").value);

            let data = document.getElementById("password").value;
            let lower = 0;
            let upper = 0;
            let number = 0;
            let symbol = 0;
            for (let i = 0; i < data.length; i++) {
                // document.write(data[i]);
                let key = data.charCodeAt(i);
                //A-65 Z-90
                //a-97 z-122
                //0-48 9-57
                //space-32
                if (key >= 65 && key <= 90) {
                    upper++;
                }
                else if (key >= 97 && key <= 122) {
                    lower++;
                }
                else if (key >= 48 && key <= 57) {
                    number++;
                }
                else {
                    symbol++;
                }
            }
            if (data.length >= 8) {
                if(upper>=1 && lower>=1 && symbol>=1 && number>=1){
                    alert("Valid Password");
                }
                else{
                    alert("Enter the Correct Characters Stream")
                }
            }
            else {
                alert("Password Must be in 8 Characters Above")
            }
            // document.write("Lower : "+lower+"<br>");
            // document.write("upper : "+upper+"<br>");
            // document.write("number : "+number+"<br>");
            // document.write("symbol : "+symbol+"<br>");
            // document.write("length : "+len+"<br>");
        }
    </script>
