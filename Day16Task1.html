<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mea+Culpa&display=swap" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
        rel="stylesheet">
    <style>
        * {
            padding: 0;
            margin: 0;
            font-family: "Poppins", sans-serif;
            font-weight: 400;
            font-style: normal;
            letter-spacing: 0;
            font-size: 24px;
            background-color: #ffdbdf;
            color: #4d0c63;
        }

        #heading {
            margin-top: 50px;
        }

        #heading h1 {
            text-align: center;
        }

        #heading h1 span {
            font-family: "Mea Culpa", cursive;
            font-weight: 600;
            font-style: normal;
        }

        #ValidatorBox {
            float: left;
            height: 400px;
            width: 400px;
            background-color: #ff9898;
            border-radius: 20px;
        }

        #Box {
            display: flex;
            justify-content: center;
            align-items: center;
            background: none;
        }

        #ValidatorBox .content {
            margin-top: 20px;
            background-color: #ff9898;
            text-align: center;
            color: #430606;
        }

        #ValidatorBox .resultBox {
            height: 50px;
            width: 250px;
            background-color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            display: flex;
            justify-content: center;
            line-height: 50px;
            /* text-align: center; */
            margin-top: 20px;
            margin-left: 19%;
        }

        #ValidatorBox form input,
        button {
            height: 50px;
            width: 250px;
            background-color: #fff;
            border: none;
            border-radius: 30px;
            font-size: 16px;
            text-align: center;
            margin-top: 20px;
        }

        #ValidatorBox form button {
            color: #ffffff;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
        }

        #ValidatorBox form button:hover {
            filter: brightness(1.08);
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(37, 99, 235, 0.35);
        }

        @media screen and (min-width:300px) and (max-width:100%) {
            #ValidatorBox {
                height: 400px;
                width: 400px;
            }
        }

        @media screen and (min-width:0) and (max-width:400px) {
            #ValidatorBox {
                height: 350px;
                width: 290px;
                /* background-color: #fff; */

            }

            #ValidatorBox .resultBox {
                margin-left: 6%;
                /* background-color: #fff; */
            }
        }
    </style>
</head>

<body>
    <section id="heading">
        <h1>Welcome To <span>Zentri</span></h1>
    </section>
    <br>
    <section id="Box">
        <div id="ValidatorBox">
            <h3 class="content">Password Validator</h3>
            <form class="content">
                <input type="text" id="data" placeholder="Enter The Password">
                <button type="button" onclick="validate()">Check Your Password</button>
            </form>
            <h1 id="result" class="resultBox">Result</h1>

        </div>
    </section>
</body>
<script>
    function validate() {
        let data = document.getElementById("data").value;
        let output = fun1(data);
        document.getElementById("result").innerText = output;
    }
    function fun1(data) {

        if (data === "") {
            return "Enter The Password";
        }
        else {
            let lower = 0;
            let upper = 0;
            let number = 0;
            let symbol = 0;
            for (let i = 0; i < data.length; i++) {
                let key = data.charCodeAt(i);
                if (key >= 65 && key <= 90) {
                    upper++;
                }
                else if (key >= 97 && key <= 122) {
                    lower++;
                }
                else if (key >= 48 && key <= 57) {
                    number++;
                }
                else {
                    symbol++;
                }
            }
            if (data.length >= 8) {
                if (upper >= 1 && lower >= 1 && symbol >= 1 && number >= 1) {
                    return "Result : Valid Password";
                }
            }
            else {
                return "Result : Invalid Password";
            }
        }
    }
</script>

</html>
