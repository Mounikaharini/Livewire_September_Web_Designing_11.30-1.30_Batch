        .overall{

        .card {

        }

        .card h1 {
            font-size: 24px;
            color: white;
            text-align: center;
        }
        .whiteLayer{
            margin: 20px;
            position: absolute;
            top: 0;
            left: 0;
            height: 210px;
            width: 210px;
            border: 3px solid rgb(4, 4, 4);
            transition: transform 2s;
        }
        .whiteLayer:hover{
             border: 3px solid rgb(0, 0, 0);
            background-color: rgba(0, 0, 0, 0.601);
            transform:rotate(360deg);
        }
    </style>
</head>
